<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survei TikTok Medan</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 py-10 px-4">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg border">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-900">📋 Survei Audiens TikTok</h1>
      <p class="text-gray-500">Segmentasi Warga Kota Medan</p>
    </div>

    <form id="survey-form" class="space-y-6">
      <div>
        <label class="block font-bold mb-2">1. Kategori Konten Favorit (Max 3):</label>
        <div class="grid grid-cols-2 gap-2 p-3 border-2 rounded bg-gray-50" data-max="3">
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Komedi"><span>Komedi</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Edukasi"><span>Edukasi</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Makanan"><span>Makanan</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Kecantikan"><span>Kecantikan</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Musik"><span>Musik</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Gaming"><span>Gaming</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Berita"><span>Berita</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="kategori_konten" value="Travel"><span>Travel</span></label>
        </div>
      </div>

      <div>
        <label class="block font-bold mb-2">2. Apa yang Paling Anda Cari? (Max 2):</label>
        <div class="grid grid-cols-2 gap-2 p-3 border-2 rounded bg-gray-50" data-max="2">
          <label class="flex items-center space-x-2"><input type="checkbox" name="sifat_video" value="Fakta"><span>Informasi</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="sifat_video" value="Hiburan"><span>Hiburan</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="sifat_video" value="Inspirasi"><span>Inspirasi</span></label>
          <label class="flex items-center space-x-2"><input type="checkbox" name="sifat_video" value="Estetik"><span>Estetika</span></label>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block font-bold mb-1">3. Durasi Video:</label>
          <select name="durasi_video" required class="w-full border-2 p-3 rounded">
            <option value="">-- Pilih --</option>
            <option value="1">< 15 detik</option>
            <option value="2">15-30 detik</option>
            <option value="3">30-60 detik</option>
            <option value="4">> 60 detik</option>
          </select>
        </div>
        <div>
          <label class="block font-bold mb-1">4. Format Konten:</label>
          <select name="format_video" required class="w-full border-2 p-3 rounded">
            <option value="">-- Pilih --</option>
            <option value="1">Video Vertical</option>
            <option value="2">Kolase</option>
            <option value="3">Live</option>
          </select>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105">🚀 Kirim Jawaban</button>
      <p id="status" class="text-center text-sm font-medium mt-4"></p>
    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFj17_Wk7ui_-E36xHSZwjF_gj5sqvPCgLqhCiz1tCGhXQLfdixI_cQ_mPdGeleJ2v/exec";

    document.querySelectorAll('[data-max]').forEach(container => {
      const max = parseInt(container.dataset.max);
      const checkboxes = container.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => {
        cb.addEventListener('change', () => {
          const checked = container.querySelectorAll('input:checked').length;
          if (checked > max) cb.checked = false;
        });
      });
    });

    document.getElementById("survey-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "⏳ Mengirim...";
      const formData = new FormData(e.target);
      const data = {
        kategori_konten: formData.getAll("kategori_konten"),
        sifat_video: formData.getAll("sifat_video"),
        durasi_video: formData.get("durasi_video"),
        format_video: formData.get("format_video")
      };
      try {
        await fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ data }) });
        status.className = "text-center text-green-600 font-bold mt-4";
        status.textContent = "✅ Terkirim!";
        e.target.reset();
      } catch (err) { status.textContent = "❌ Error."; }
    });
  </script>
</body>
</html>
