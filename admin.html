<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Analisis K-Means</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-blue-900 border-b-4 border-blue-500 pb-2">Dashboard Analisis K-Means</h1>

    <div id="login-section" class="bg-white p-6 rounded shadow-lg max-w-sm mx-auto">
      <label class="block text-sm font-bold mb-2">Password Admin:</label>
      <input id="admin-password" type="password" class="w-full border p-2 rounded mb-4" placeholder="PASSWORD">
      <button id="load-data" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Ambil Data Survei</button>
      <p id="status-message" class="text-center text-xs mt-2 text-red-500"></p>
    </div>

    <div id="main-app" class="hidden space-y-6">
      <div class="bg-white p-6 rounded shadow-lg">
        <h2 class="font-bold text-xl mb-4">Data Responden Masuk</h2>
        <div class="overflow-y-auto max-h-64 border rounded">
          <table class="min-w-full text-left bg-white">
            <thead class="bg-blue-900 text-white sticky top-0">
              <tr>
                <th class="p-2 text-center text-xs">No</th>
                <th class="p-2 text-xs">Durasi</th>
                <th class="p-2 text-xs">Format</th>
                <th class="p-2 text-xs">Kategori Dominan</th>
                <th class="p-2 text-xs">Sifat Konten</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded shadow-lg">
          <h2 class="font-bold text-lg mb-2">Langkah 1: Cari K Optimal</h2>
          <button id="elbow-btn" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Cari K Optimal (Elbow)</button>
          <div id="elbow-container" class="mt-4 hidden relative h-48 w-full">
            <canvas id="elbowChart"></canvas>
          </div>
        </div>
        <div id="execution-step" class="hidden bg-white p-6 rounded shadow-lg">
          <h2 class="font-bold text-lg mb-2">Langkah 2: Klasterisasi</h2>
          <select id="k-optimal" class="w-full border p-2 rounded mb-4 font-bold"></select>
          <button id="analyze-btn" class="w-full bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700">Jalankan Analisis Final</button>
        </div>
      </div>

      <div id="results-section" class="hidden bg-white p-6 rounded shadow-lg">
        <h3 class="font-bold text-xl mb-4 text-center">Visualisasi & Hasil Klaster</h3>
        
        <div class="flex flex-col md:flex-row gap-4 mb-6 bg-gray-50 p-4 rounded border">
          <div class="flex-1">
            <label class="text-xs font-bold uppercase text-gray-700">Sumbu X:</label>
            <select id="select-x" class="w-full p-2 border rounded"></select>
          </div>
          <div class="flex-1">
            <label class="text-xs font-bold uppercase text-gray-700">Sumbu Y:</label>
            <select id="select-y" class="w-full p-2 border rounded"></select>
          </div>
          <div class="flex-none flex items-end gap-2">
            <button id="update-scatter-btn" class="w-full md:w-auto bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition shadow">🔄 Update Grafik</button>
            <button id="download-csv-btn" class="w-full md:w-auto bg-green-600 text-white font-bold px-4 py-2 rounded hover:bg-green-700 transition shadow">💾 Export CSV</button>
            <button id="download-chart-btn" class="w-full md:w-auto bg-purple-600 text-white font-bold px-4 py-2 rounded hover:bg-purple-700 transition shadow">🖼️ Simpan Gambar</button>
          </div>
        </div>
        
        <div class="relative h-96 w-full border-2 border-dashed border-gray-200 p-2 rounded mb-8 bg-white">
          <canvas id="scatterChart"></canvas>
        </div>

        <div class="border-t-2 border-gray-100 pt-6">
          <h4 class="font-bold text-lg mb-4 text-gray-800 uppercase tracking-wider">Rincian Profil Segmen</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="result-text">
            </div>
        </div>
      </div>
    </div>
  </div>

  <script src="kmeans.js?v=2"></script>
</body>
</html>
