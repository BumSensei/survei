<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Analisis K-Means</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-blue-900 border-b-4 border-blue-500 pb-2">📊 Dashboard Analisis K-Means</h1>

    <div id="login-section" class="bg-white p-6 rounded shadow-lg max-w-sm mx-auto">
      <label class="block text-sm font-bold mb-2">🔑 Password Admin:</label>
      <input id="admin-password" type="password" class="w-full border p-2 rounded mb-4" placeholder="STMIKTIME">
      <button id="load-data" class="w-full bg-blue-600 text-white font-bold py-2 rounded">📥 Ambil Data Survei</button>
      <p id="status-message" class="text-center text-xs mt-2 text-red-500"></p>
    </div>

    <div id="main-app" class="hidden space-y-6">
      <div class="bg-white p-6 rounded shadow-lg grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h2 class="font-bold text-lg mb-2">Langkah 1: Metode Elbow</h2>
          <button id="elbow-btn" class="w-full bg-yellow-500 text-white font-bold py-2 rounded">📈 Cari K Optimal</button>
          <div id="elbow-container" class="mt-4 hidden h-48"><canvas id="elbowChart"></canvas></div>
        </div>
        <div id="execution-step" class="hidden">
          <h2 class="font-bold text-lg mb-2">Langkah 2: Klasterisasi</h2>
          <select id="k-optimal" class="w-full border p-2 rounded mb-2 font-bold"></select>
          <button id="analyze-btn" class="w-full bg-green-600 text-white font-bold py-2 rounded">▶️ Jalankan Final</button>
        </div>
      </div>

      <div id="results-section" class="hidden bg-white p-6 rounded shadow-lg">
        <h3 class="font-bold text-xl mb-4 text-center">Visualisasi Klaster</h3>
        <div class="grid grid-cols-2 gap-4 mb-4 bg-gray-50 p-3 rounded">
          <div><label class="text-xs font-bold uppercase">Sumbu X:</label><select id="select-x" class="w-full p-2 border rounded"></select></div>
          <div><label class="text-xs font-bold uppercase">Sumbu Y:</label><select id="select-y" class="w-full p-2 border rounded"></select></div>
        </div>
        <div class="h-80"><canvas id="scatterChart"></canvas></div>
        <div id="result-text" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6"></div>
      </div>
    </div>
  </div>
  <script src="kmeans.js"></script>
</body>
</html>
